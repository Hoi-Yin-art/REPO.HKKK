<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>R.E.P.O.&HK | Cyberpunk Terminal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+TC:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Cyberpunk 2077 經典配色定義 */
      --cyber-yellow: #fcee0a;
      --cyber-cyan: #00f0ff;
      --cyber-magenta: #ff0055;
      --cyber-dark: #030305;
      --bg-primary: #0a0a0f;
      --bg-secondary: #050508;
      --fg: #ffffff;
      --fg-muted: #8b929a;
      --card-bg: rgba(10, 10, 15, 0.85);
      --border-cyan: rgba(0, 240, 255, 0.4);
    }

    html {
      font-size: 16px;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg-primary);
      color: var(--fg);
      overflow-x: hidden;
      position: relative;
    }

    /* 🌌 賽博龐克背景層 (支援 GIF 或動態影片質感) */
    .bg-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      /* 這裡可以放入 Cyberpunk 相關的動態 GIF 網址 */
      background: linear-gradient(180deg, rgba(3,3,5,0.8) 0%, rgba(10,10,15,0.95) 100%), 
                  url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1200') no-repeat center center;
      background-size: cover;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* 霓虹浮動光暈 */
    .floating-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      animation: float 15s ease-in-out infinite;
    }

    .shape-1 { width: 350px; height: 350px; background: var(--cyber-magenta); top: -50px; left: -100px; }
    .shape-2 { width: 300px; height: 300px; background: var(--cyber-cyan); bottom: -50px; right: -50px; animation-delay: -5s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -40px) scale(1.1); }
    }

    /* 數位粒子效果 */
    .particles { position: absolute; inset: 0; overflow: hidden; }
    .particle {
      position: absolute;
      width: 2px;
      height: 6px; /* 條狀更像數位代碼 */
      background: var(--cyber-cyan);
      opacity: 0;
      animation: particle-rise 6s ease-in infinite;
    }

    @keyframes particle-rise {
      0% { opacity: 0; transform: translateY(100vh) scaleY(0); }
      20% { opacity: 0.7; }
      90% { opacity: 0.4; }
      100% { opacity: 0; transform: translateY(-10vh) scaleY(2); }
    }

    /* 🎴 賽博主卡片 */
    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--border-cyan);
      border-left: 4px solid var(--cyber-cyan); /* 經典科技切邊感 */
      border-radius: 4px 24px 4px 24px; /* 破格不對稱裁剪 */
      padding: 2.5rem 2rem;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(255, 0, 85, 0.1);
      animation: card-entrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes card-entrance {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 🏷️ 卡片右上角 Cyberpunk 標籤飾條 */
    .card::before {
      content: "SYSTEM: ONLINE";
      position: absolute;
      top: -10px;
      right: 20px;
      background: var(--cyber-yellow);
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      font-weight: 900;
      padding: 2px 8px;
      letter-spacing: 1px;
      border-radius: 2px;
    }

    /* 👤 霓虹頭像外框 */
    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 1.5rem;
    }

    .avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(
        var(--cyber-cyan),
        var(--cyber-magenta),
        var(--cyber-yellow),
        var(--cyber-cyan)
      );
      animation: ring-rotate 4s linear infinite;
      filter: drop-shadow(0 0 8px var(--cyber-cyan));
    }

    @keyframes ring-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #000;
      z-index: 1;
      transition: transform 0.3s ease;
    }

    .avatar:hover {
      transform: scale(1.05) rotate(3deg);
    }

    /* 🔤 文字與排版 */
    h1 {
      font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--cyber-yellow);
      text-transform: uppercase;
      margin-bottom: 0.8rem;
      letter-spacing: 0.05em;
      text-shadow: 0 0 10px rgba(252, 238, 10, 0.3);
    }

    .bio {
      color: var(--fg-muted);
      font-size: 0.9rem;
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 1.2rem;
      text-align: left;
      border-left: 2px solid rgba(255, 255, 255, 0.1);
      padding-left: 8px;
    }

    /* 🔗 霓虹流光按鈕系統 */
    .social-links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      padding: 0.9rem 1.25rem;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
      position: relative;
      z-index: 1;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    /* 按鈕 RGB 流光邊框效果 */
    .btn::before {
      content: "";
      position: absolute;
      inset: -2px;
      z-index: -2;
      background: linear-gradient(90deg, 
        var(--cyber-cyan), 
        var(--cyber-magenta), 
        var(--cyber-yellow), 
        var(--cyber-cyan)
      );
      background-size: 300% 100%;
      animation: rgbFlow 4s linear infinite;
    }

    /* 內層黑底，達成精緻的細邊框感 */
    .btn::after {
      content: "";
      position: absolute;
      inset: 1px;
      background: #0d0e12;
      z-index: -1;
      border-radius: 3px;
      transition: background 0.3s;
    }

    @keyframes rgbFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* 懸停動態：背景變透明、亮起霓虹色 */
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      color: var(--cyber-yellow);
    }
    
    .btn:hover::after {
      background: rgba(13, 14, 18, 0.85);
    }

    .btn i {
      font-size: 1.2rem;
      color: var(--cyber-cyan);
    }

    /* 🔚 頁尾資訊 */
    .footer {
      margin-top: 2rem;
      font-size: 11px;
      font-family: 'Orbitron', sans-serif;
      color: var(--fg-muted);
      letter-spacing: 2px;
    }

    /* 響應式調整 */
    @media (max-width: 400px) {
      .card { padding: 2rem 1.25rem; }
      h1 { font-size: 1.5rem; }
    }

    /* 尊重使用者減少動效設定 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- 背景層 -->
  <div class="bg-layer">
    <div class="bg-grid"></div>
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="particles" id="particles"></div>
  </div>

  <!-- 主卡片 -->
  <div class="card">
    <div class="avatar-wrapper">
      <div class="avatar-ring"></div>
      <!-- 請確保 REPOHKKK.jpg 與此網頁檔案在同一個資料夾，或改成線上網址 -->
      <img src="REPOHKKK.jpg" alt="R.E.P.O. HK" class="avatar" />
    </div>
    
    <h1>R.E.P.O. & HK</h1>
    
    <div class="bio">
      🧑‍🤝‍🧑 和朋友一起打遊戲的時光，總是特別開心。不只是勝負，而是那種一起笑、一起鬧的瞬間，才是最珍記的回憶。
    </div>
    
    <div class="bio">
      🌎 在無數個虛擬世界中征戰，與朋友並肩作戰的每一場遊戲，都是名為「REPO」的冒險篇章。
    </div>
    
    <!-- 社交連結按鈕 -->
    <div class="social-links">
      
      <a href="https://discord.gg/yw2pFFDW7j" target="_blank" rel="noopener noreferrer" class="btn">
        <i class="fab fa-discord"></i> 開心玩遊戲 HK, TW, MO 群
      </a>

      <a href="https://discord.gg/tV9RVw9Z" target="_blank" rel="noopener noreferrer" class="btn">
        <i class="fab fa-discord"></i> @R.E.P.O.HKKK
      </a>

    </div>

    <div class="footer">
      // PROTOCOL_v2.6 // NIGHT_CITY_NET
    </div>
  </div>

  <!-- 數位下落粒子 Script -->
  <script>
    const container = document.getElementById('particles');
    if (container) {
      const particleCount = 20;
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 6 + 's';
        particle.style.animationDuration = (4 + Math.random() * 4) + 's';
        // 隨機分配青色或桃紅色的程式碼粒子
        particle.style.background = Math.random() > 0.5 ? '#00f0ff' : '#ff0055';
        container.appendChild(particle);
      }
    }
  </script>
</body>
</html>
